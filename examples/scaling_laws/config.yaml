###############################################################
# AUTOEXP.
# Special variables used by autoexp.

autoexp:

    exp_name: "{model_size}_lr{args.lr}_bsz{args.batch_size}_bias{bias_name}_nnodes{slurm.nnodes}"
    name: "{exp_name}_{phase}_{cd_scale}_{mode}"

    # Checkpoint directory
    run_dir: "TODO"

    # Folder with sbatch templates
    sbatch_path: "/leonardo/home/userexternal/najroldi/oellm/dev/autoexperiment/examples/scaling_laws/"
    sbatch_out_path: "/leonardo/home/userexternal/najroldi/oellm/dev/autoexperiment/examples/scaling_laws/generated"

    # Templated sbatch.
    template: "{sbatch_path}/{mode}.sbatch"

    # Destination of genrated sbatch script.
    sbatch_script: "{sbatch_out_path}/{name}.sbatch"

    # Launch the generated sbatch script.
    cmd: "sbatch {sbatch_script}"

###############################################################
# TEMPLATE ARGS.
# Placeholders in the templated sbatch. TODO: change name?

slurm:
    output_file: "/leonardo/home/userexternal/najroldi/oellm/dev/autoexperiment/examples/scaling_laws/logs/{name}/slurm_{mode}.out"
    name: "{autoexp.name}"

###############################################################
# MEGATRON ARGS.
# These args are concatenated and passed verbatim to Megatron-LM.

args:
    data_path: 1
    num_layers: 1
    hidden_size: 1
    train_iters: 1

###############################################################
# OPTIONAL EXPERIMENT SETUP.
# This allows to easily distinguish between megatron args, slurm args, and intermediate variables.

experiments:

    args.lr: [1.e-2]
    args.batch_size: [4, 16]

    model_size:
        - 10M:
            args.num_layers: 5
            args.hidden_size: 256
            slurm.nnodes: 1
        - 30M:
            args.num_layers: 10
            args.hidden_size: 512
            slurm.nnodes: 2

    bias:
        - with:
            args.disable_bias_linear: ""
            bias_name: "with"
        - without:
            args.disable_bias_linear: "--disable-bias-linear"
            bias_name: "without"

    # A folder where we collect helpers shell scripts.
    scripts: "/leonardo/home/userexternal/najroldi/oellm/dev/autoexperiment/scripts/megatron/scaling_laws"
    output_file: "{slurm.output_file}"

    phase:
        - pretrain:
            cd_scale: "None"
            mode:
                - train:
                    autoexp.termination_cmd: "{scripts}/finished_{mode}.sh {output_file}"
                - convert_eval:
                    autoexp.start_condition_cmd: "{scripts}/pending_convert_eval.sh {run_dir}"
                    autoexp.termination_cmd: "{scripts}/finished_{mode}.sh {output_file} {run_dir}"
        - cooldown:
            cd_scale:
                - 10S:
                    args.total_steps: 10
                - 20S:
                    args.total_steps: 20
            cooldown_fraction: 0.1
            args.lr_wsd_decay_iters: "expr({args.train_iters}*{cooldown_fraction})"
            mode:
                - train:
                    autoexp.start_condition_cmd: "{scripts}/pending_cooldown.sh {logs} {exp_name} {cd_scale}"
                    autoexp.termination_cmd: "{scripts}/finished_{mode}.sh {output_file}"
                - convert_eval:
                    autoexp.start_condition_cmd: "{scripts}/pending_convert_eval.sh {run_dir}"
                    autoexp.termination_cmd: "{scripts}/finished_{mode}.sh {output_file} {run_dir}"
